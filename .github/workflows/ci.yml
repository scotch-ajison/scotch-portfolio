name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Content invariants
        run: npm run check:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Must succeed with no secrets present — every client is constructed
      # lazily inside its handler for exactly this reason.
      - name: Build
        run: npm run build
